name: build-installer
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\.git\\' } | ForEach-Object { $_.FullName }
          if (-not (Test-Path static/index.html)) { throw 'مجلد static غير موجود' }
          if (-not (Test-Path icon.ico)) { throw 'icon.ico غير موجود' }
      - name: Install tools
        run: python -m pip install pyinstaller pywebview
      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --clean --name LibrarySystem --icon icon.ico --add-data "static;static" app.py
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LibrarySystem-Setup
          path: installer/LibrarySystem-Setup.exe
